<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="title">Clip Upload</h1>
        <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <input type="file" name="file" class="button" accept="video/*">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter password">
            </div>
            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                <input type="checkbox" name="public" value="true">
                                    Public
                </label>
            </div>
            <div class="form-group">
                <input type="submit" value="Upload" class="button">
            </div>
        </form>
        <p id="status-msg" class="messages"></p>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <p class="messages">{{ messages[0] }}</p>
        {% endif %}
        {% endwith %}

    </div>
    <div class="container" style="margin-top: 20px;">
        <a href="/clips">
            <button class="button">All Clips</button>
        </a>
    </div>

    <script>
        document.getElementById("upload-form").addEventListener("submit", async function(e) {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const statusMsg = document.getElementById("status-msg");

            statusMsg.innerText = "Checking password...";

            const formData = new FormData();
            formData.append("password", password);

            const checkRes = await fetch("/checkpassword", {
                method: "POST",
                body: formData
            });

            if (!checkRes.ok) {
                statusMsg.innerText = "Wrong password ❌";
                return;
            }

            statusMsg.innerText = "Uploading...";
            e.target.submit();
        });
    </script>
</body>
</html>
