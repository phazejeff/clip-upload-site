<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clips</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        .clips-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .clips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .clip-card {
            background-color: #1E1E1E;
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .clip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 18px rgba(0,0,0,0.35);
        }

        .clip-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #2C2C2C;
        }

        .clip-title {
            padding: 12px;
            font-size: 1rem;
            color: #BB86FC;
            word-break: break-word;
        }

        .clip-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #2C2C2C;
            filter: blur(5px);
            transition: filter 0.3s ease;
        }

        .clip-image.loaded {
            filter: blur(0);
        }
    </style>
</head>

<body>
    <div class="clips-container">
        <h1 class="title">Clips</h1>
        <div id="clips" class="clips-grid"></div>
    </div>

    <script>
        async function loadClips() {
            const res = await fetch("/api/clips");
            const data = await res.json();

            const container = document.getElementById("clips");

            data.forEach(obj => {
                const filename = Object.keys(obj)[0];   // e.g. "abc123.webm"
                const title = obj[filename].title;

                const hash = filename.split('.').slice(0, -1).join('.'); // handles dots safely

                const card = document.createElement("a");
                card.href = `/clip/${filename}`;  // use full filename
                card.className = "clip-card";

                const img = document.createElement("img");
                img.src = `/photo/${hash}.jpg`;   // thumbnail still uses hash
                img.className = "clip-image";
                img.loading = "lazy";
                img.onload = () => {
                    img.classList.add("loaded");
                };

                const titleDiv = document.createElement("div");
                titleDiv.className = "clip-title";
                titleDiv.innerText = title;

                card.appendChild(img);
                card.appendChild(titleDiv);
                container.appendChild(card);
            });
        }

        loadClips();
    </script>
</body>
</html>
